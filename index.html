<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14221d" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>BSC BioLab: What The Beast?!</title>
    <meta name="description" content="لعبة نادي العلوم البيولوجية - جامعة الكويت: ركّب مخلوق هجين وعِش مغامرة علمية." />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <!-- Hand-inked look for creature illustrations: slight line wobble + paper bleed -->
      <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
